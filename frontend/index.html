<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MTG Collection</title>
<meta name="description" content="Matt's Magic: The Gathering collection">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
<link rel="preconnect" href="https://mtg-api.mattshoe81.workers.dev">
<link rel="preconnect" href="https://cards.scryfall.io">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <a class="brand" href="#/search">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text">Collection</span>
  </a>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#/search" data-view="search">Search</a>
    <a href="#/decks"  data-view="decks">Decks</a>
    <a href="#/add"    data-view="add">Add</a>
    <a href="#/remove" data-view="remove">Remove</a>
    <a href="#/stats"  data-view="stats">Stats</a>
    <a href="#/console" data-view="console">Console</a>
    <a href="#/logs"   data-view="logs">Logs</a>
  </nav>

  <div class="topbar-right">
    <span class="conn" id="conn" title="API status"><i></i><span id="conn-text">connecting</span></span>
    <button class="icon-btn" id="theme-btn" aria-label="Toggle theme" title="Toggle theme (T)">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-moon"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <div id="view"></div>
</main>

<!-- Card detail, opened from anywhere -->
<div class="drawer-scrim" id="drawer-scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Card detail" tabindex="-1">
  <div id="drawer-body"></div>
</aside>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="palette-scrim" id="palette-scrim" hidden>
  <div class="palette" role="dialog" aria-label="Quick find">
    <input id="palette-input" type="text" placeholder="Jump to a card…" autocomplete="off" spellcheck="false">
    <ul id="palette-list"></ul>
    <div class="palette-hint">↑↓ move · ↵ open · esc close</div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
