<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MTG Collection</title>
<meta name="description" content="Matt's Magic: The Gathering collection">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1116">
<link rel="preconnect" href="https://mtg-api.mattshoe81.workers.dev">
<link rel="preconnect" href="https://cards.scryfall.io">
<!-- The same stylesheet the hand-written page used, unchanged. The two
     renderings are meant to look alike and one stylesheet is how that
     stays true without anybody maintaining a second copy. -->
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <!-- The menu, the mark and the page title belong in the bar. The
       shared build draws all three here; the slot is static only
       because the header itself is. -->
  <!-- The whole bar, so the shared build can put the profile at the
       right-hand end of it the way the phone does. There was an
       "Android app" link in a `topbar-right` slot beside this one;
       it is a place you can go, so it is in the menu with the other
       places you can go, and the header holds nothing pressable that
       no Kotlin test mounts. `StaticHeaderTest` keeps it that way. -->
  <div id="nav" class="topbar-nav"></div>
</header>

<!-- The nav, the screens and every dialog are drawn by the shared
     Kotlin build; there is nothing static left to keep in step with
     Android. -->
<main id="main"><div id="view"></div></main>

<script src="kmp/mtg.js"></script>
<script>
(function () {
  // The service worker's share target hands a list over in the
  // fragment. Take it out of the URL before mounting: leaving a whole
  // decklist in the address bar means a reload re-applies it, and any
  // link copied out of here carries it.
  function sharedList() {
    var m = /[?&]share=([^&]*)/.exec(location.hash);
    if (!m) return null;
    var list = null;
    try { list = (JSON.parse(decodeURIComponent(m[1])) || {}).list || null; } catch (e) {}
    var clean = location.hash.replace(/[?&]share=[^&]*/, '').replace(/\?$/, '') || '#/entry';
    try { history.replaceState(history.state, '', clean); } catch (e) {}
    return list;
  }

  // Plain text under the one key `AdminToken` in `:core` owns — see
  // `apps/core/.../Shell.kt`. It used to be a JSON blob with an
  // `expires_at` nobody ever set; the Worker does not issue timed
  // tokens, and keeping the format in two places (here and in the
  // Kotlin that writes it) is exactly how they drift.
  function token() {
    try { return localStorage.getItem('mtg.admin') || ''; }
    catch (e) { return ''; }
  }

  window.mtgApp.mount(document.getElementById('view'), sharedList(), token());
  window.mtgApp.mountNav(document.getElementById('nav'));

  // Only for the share target. It intercepts nothing else.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
}());
</script>
</body>
</html>
