<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MTG Collection</title>
<meta name="description" content="Matt's Magic: The Gathering collection">
<!-- What a bare link to the site unfurls as. A deck or a card shared
     from inside the app gets its own tags from the Worker instead:
     this page routes on a hash, and a fragment never reaches a
     server, so nothing here can say which deck you sent. -->
<meta property="og:site_name" content="Matt's MTG Collection">
<meta property="og:type" content="website">
<meta property="og:title" content="Matt's MTG Collection">
<meta property="og:description" content="Every card, every deck, and what is spare.">
<meta property="og:url" content="https://mtg.mattshoe.org/">
<meta property="og:image" content="https://mtg.mattshoe.org/icons/icon-192.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Matt's MTG Collection">
<meta name="twitter:description" content="Every card, every deck, and what is spare.">
<meta name="twitter:image" content="https://mtg.mattshoe.org/icons/icon-192.png">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1116">
<link rel="preconnect" href="https://mtg-api.mattshoe81.workers.dev">
<link rel="preconnect" href="https://cards.scryfall.io">
<!-- The same stylesheet the hand-written page used, unchanged. The two
     renderings are meant to look alike and one stylesheet is how that
     stays true without anybody maintaining a second copy. -->
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <!-- The menu, the mark and the page title belong in the bar. The
       shared build draws all three here; the slot is static only
       because the header itself is. -->
  <div id="nav" class="topbar-nav"></div>
  <div class="topbar-right">
    <!-- Leaves the app entirely, so it is not a view and never lights
         up as the current one. -->
    <a href="app/" class="tabs-away">Android app</a>
  </div>
</header>

<!-- The nav, the screens and every dialog are drawn by the shared
     Kotlin build; there is nothing static left to keep in step with
     Android. -->
<main id="main"><div id="view"></div></main>

<script src="kmp/mtg.js"></script>
<script>
(function () {
  // The service worker's share target hands a list over in the
  // fragment. Take it out of the URL before mounting: leaving a whole
  // decklist in the address bar means a reload re-applies it, and any
  // link copied out of here carries it.
  function sharedList() {
    var m = /[?&]share=([^&]*)/.exec(location.hash);
    if (!m) return null;
    var list = null;
    try { list = (JSON.parse(decodeURIComponent(m[1])) || {}).list || null; } catch (e) {}
    var clean = location.hash.replace(/[?&]share=[^&]*/, '').replace(/\?$/, '') || '#/entry';
    try { history.replaceState(history.state, '', clean); } catch (e) {}
    return list;
  }

  function token() {
    try { return (JSON.parse(localStorage.getItem('mtg.admin') || '{}') || {}).token || ''; }
    catch (e) { return ''; }
  }

  window.mtgApp.mount(document.getElementById('view'), sharedList(), token());
  window.mtgApp.mountNav(document.getElementById('nav'));

  // Only for the share target. It intercepts nothing else.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
}());
</script>
</body>
</html>
