<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MTG Collection</title>
<meta name="description" content="Matt's Magic: The Gathering collection">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1116">
<link rel="preconnect" href="https://mtg-api.mattshoe81.workers.dev">
<link rel="preconnect" href="https://cards.scryfall.io">
<link rel="stylesheet" href="css/app.css">

<!-- GitHub Pages serves everything with Cache-Control: max-age=600, so a
     deploy would otherwise reach an open browser as a mix of old and new
     files. The deploy stamps this map with ?v=<commit>, which makes every
     module a new URL and pins one consistent set of them per page load.
     Left empty it is a no-op, which is what local development wants. -->
<script type="importmap">{"imports":{}}</script>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <a class="brand" href="#/search">
    <img class="brand-mark" src="icons/icon-32.png" alt="" width="22" height="22">
    <span class="brand-text">Collection</span>
  </a>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#/search" data-view="search">Library</a>
    <a href="#/decks"  data-view="decks">Decks</a>
    <a href="#/stats"  data-view="stats">Stats</a>
    <a href="#/console" data-view="console">Query</a>
    <span class="tabs-sep" data-gated hidden aria-hidden="true"></span>
    <span class="tabs-group" data-gated hidden>Admin options</span>
    <a href="#/add"    data-view="add" data-gated hidden>Bulk Add</a>
    <a href="#/remove" data-view="remove" data-gated hidden>Bulk Remove</a>
    <a href="#/logs"   data-view="logs" data-gated hidden>Server Logs</a>
  </nav>

  <div class="topbar-right">
  </div>
</header>

<main id="main">
  <div id="view"></div>
</main>

<!-- Card detail, opened from anywhere -->
<div class="drawer-scrim" id="drawer-scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Card detail" tabindex="-1">
  <div id="drawer-body"></div>
</aside>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="palette-scrim" id="palette-scrim" hidden>
  <div class="palette" role="dialog" aria-label="Quick find">
    <input id="palette-input" type="text" placeholder="Jump to a card…" autocomplete="off" spellcheck="false">
    <ul id="palette-list"></ul>
    <div class="palette-hint">↑↓ move · ↵ open · esc close</div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
