# Deliberately not setting `qualifiers`.
#
# Making the JVM device a Pixel-shaped `w411dp-h891dp-xxhdpi` did fix
# three tests that fail on Robolectric's small default screen — and
# broke ten others, every one of them a dialog, with "Compose did not
# get idle after 60 SECONDS". The run went from 80 seconds to 646.
#
# So the three stay device-only, marked with `needsRealRendering`, and
# the other 329 run here in under two minutes. Measured both ways
# rather than guessed.
sdk=34
