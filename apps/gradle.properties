org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Compose needs it. :app and :sender use no AndroidX at all, so this
# changes nothing for them — verified by building both after the flip.
android.useAndroidX=true
kotlin.code.style=official
# Six modules, configured and built one after another until now. :core
# and :core-net do not wait on each other, and a task whose inputs have
# not changed should not run twice.
org.gradle.parallel=true
org.gradle.caching=true
