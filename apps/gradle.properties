org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Compose needs it. :sender uses no AndroidX at all, so this changes
# nothing for it.
android.useAndroidX=true
kotlin.code.style=official
# Five modules, configured and built one after another until now. :core
# and :core-net do not wait on each other, and a task whose inputs have
# not changed should not run twice.
org.gradle.parallel=true
org.gradle.caching=true
