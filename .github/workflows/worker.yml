name: worker

# The API, deployed.
#
# It used to be a `wrangler deploy` somebody had to remember, so the site
# could ship a build that talked to a Worker three commits behind it —
# which is exactly what happened: idempotency keys, the 503 for an
# overloaded database and the query telemetry all sat committed and dead
# for an afternoon because nothing pushed them.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'schema.sql'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

# One deploy at a time, and never cancelled half-way.
concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # The same suite `test` runs, again here rather than trusted from
      # another workflow: a red test must stop the deploy, and a
      # separate workflow going green is not a promise about this commit.
      - name: Test against a real D1 in workerd
        run: npm test

      # Schema first. The code that needs a column must not go out ahead
      # of the column — every migration is written to be a no-op when it
      # has already been applied.
      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply mtg --remote

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Deployed is not the same as working. This is the one check that
      # the thing people actually use answers.
      - name: It answers
        run: python3 scripts/smoke.py
