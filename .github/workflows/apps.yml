name: apps

# Everything the phone and the website are made of, on every push.
#
# Before this existed the only automated check was the Worker's own
# Vitest suite; the 800-odd Kotlin tests ran when somebody remembered
# to run them, which is the same as not having them. The deploy gate in
# pages.yml runs the fast half of this — a red test there stops the
# site going out — and this runs all of it including the emulator.
on:
  push:
    paths:
      - 'apps/**'
      - 'frontend/css/**'
      - '.github/workflows/apps.yml'
  # No path filter on a pull request. These are required checks now,
  # and a required check that is skipped never reports — the pull
  # request waits for it forever. Pushes still filter: there is no
  # point building the apps for a change to the Worker.
  pull_request:
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shared logic, on both targets it has to work on. Fast, and the
  # one job that must never be skipped.
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Core and network, JVM and JS
        working-directory: apps
        run: >-
          ./gradlew --no-daemon
          :core:jvmTest :core:jsNodeTest
          :core-net:jvmTest :core-net:jsNodeTest

      # `CoverageGateTest` and `InventoryTest` run inside :core:jvmTest
      # above — re-running them with a filter here would overwrite the
      # results Kover reads.
      - name: Line coverage floor
        working-directory: apps
        run: ./gradlew --no-daemon :core:koverVerify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-test-results
          path: apps/*/build/test-results/**/*.xml

  # The website, clicked, in a real browser. Karma drives headless
  # Chrome — Compose HTML recomposes on requestAnimationFrame, so a
  # browser that is not painting proves nothing.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Browser tests
        working-directory: apps
        run: ./gradlew --no-daemon :webApp:jsBrowserTest

      - name: It still builds
        working-directory: apps
        run: ./gradlew --no-daemon :webApp:jsBrowserDistribution

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: apps/webApp/build/test-results/**/*.xml

  # The app, on an actual Android. Slow, so it runs last and on its own.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: It compiles
        working-directory: apps
        run: ./gradlew --no-daemon :androidApp:assembleDebug :app:assembleDebug

      # KVM, so the emulator is not software-rendered and the job
      # finishes this century.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: apps
          # :app's LiveApiTest needs a token it is not given here, so
          # it skips itself. Nothing in CI touches the real database.
          script: ./gradlew --no-daemon :androidApp:connectedDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: apps/androidApp/build/outputs/androidTest-results/**/*.xml

  # One number, so a pull request says how much was actually run.
  tally:
    runs-on: ubuntu-latest
    needs: [shared, web, android]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results
      # Reports, does not judge — `shared`, `web` and `android` above
      # already fail on a red test, and a second X for the same cause
      # is noise.
      - name: Count them
        continue-on-error: true
        run: python3 scripts/count_tests.py results

  # The app, on a phone. The site's Download button points at
  # `releases/latest/download/mtg-collection.apk`, and until now
  # nothing put an APK there — every release was cut by hand, so the
  # button served whatever somebody last remembered to upload.
  #
  # Only from main, and only behind the tests above: shipping a build
  # that failed its own suite to a phone is worse than not shipping.
  release:
    runs-on: ubuntu-latest
    needs: [shared, web, android]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No key, no APK — but not a red build either. Android refuses
      # to update an app signed with a different key, so the only
      # alternatives are "publish nothing" and "publish something
      # nobody can install over the top". It says so loudly on every
      # run instead of failing, so main stays honest about the tests
      # rather than about a missing secret.
      - name: Is the signing key here
        id: key
        env:
          STORE: ${{ secrets.MTG_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$STORE" ]; then
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning::No APK published: MTG_ANDROID_KEYSTORE_BASE64 is not set." \
                 "Android will not update an app signed with a different key, so this" \
                 "job will not substitute one. See the README for the three secrets."
            {
              echo "### Android app not published"
              echo
              echo "The signing key is not available to this build, so no APK was"
              echo "produced. The Download button still serves the last release."
              echo "Add \`MTG_ANDROID_KEYSTORE_BASE64\`, \`MTG_ANDROID_KEYSTORE_PASSWORD\`"
              echo "and \`MTG_ANDROID_KEY_ALIAS\` — see the README."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "have=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.key.outputs.have == 'yes'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.have == 'yes'

      - name: Unpack the signing key
        if: steps.key.outputs.have == 'yes' 
        env:
          STORE: ${{ secrets.MTG_ANDROID_KEYSTORE_BASE64 }}
        run: echo "$STORE" | base64 -d > "$RUNNER_TEMP/mtg-release.jks"

      # Commits on main only ever go up, so the code only ever goes up,
      # which is the one thing Android insists on. The offset keeps it
      # above the 4 that was last published by hand.
      - name: Work out the version
        if: steps.key.outputs.have == 'yes'
        id: v
        run: |
          echo "code=$(( $(git rev-list --count HEAD) + 100 ))" >> "$GITHUB_OUTPUT"
          echo "name=$(grep -oE 'versionName = System.getenv\("MTG_VERSION_NAME"\) \?: "[^"]+"' \
            apps/androidApp/build.gradle.kts | grep -oE '"[0-9.]+"$' | tr -d '"')" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        if: steps.key.outputs.have == 'yes'
        working-directory: apps
        env:
          MTG_ANDROID_KEYSTORE: ${{ runner.temp }}/mtg-release.jks
          MTG_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MTG_ANDROID_KEYSTORE_PASSWORD }}
          MTG_ANDROID_KEY_ALIAS: ${{ secrets.MTG_ANDROID_KEY_ALIAS }}
          MTG_VERSION_CODE: ${{ steps.v.outputs.code }}
          MTG_VERSION_NAME: ${{ steps.v.outputs.name }}
        run: ./gradlew --no-daemon :androidApp:assembleRelease

      - name: It has to actually be signed
        if: steps.key.outputs.have == 'yes'
        run: |
          APK=$(find apps/androidApp/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::no APK was produced"; exit 1; }
          cp "$APK" mtg-collection.apk
          # An unsigned APK installs on nothing. Fail here rather than
          # publishing one to the Download button.
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs mtg-collection.apk

      - name: Publish it where the site looks for it
        if: steps.key.outputs.have == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v${{ steps.v.outputs.name }}-${{ steps.v.outputs.code }}"
          gh release create "$TAG" mtg-collection.apk \
            --title "Android app ${{ steps.v.outputs.name }} (${{ steps.v.outputs.code }})" \
            --notes "Built from ${{ github.sha }}. Install over the top; same signing key." \
            --latest
