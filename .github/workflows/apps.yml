name: apps

# Everything the phone and the website are made of, on every push.
#
# Before this existed the only automated check was the Worker's own
# Vitest suite; the 800-odd Kotlin tests ran when somebody remembered
# to run them, which is the same as not having them. The deploy gate in
# pages.yml runs the fast half of this — a red test there stops the
# site going out — and this runs all of it including the emulator.
on:
  # Pull requests only.
  #
  # This used to run on pushes to main as well, which meant merging
  # re-ran the entire matrix — emulator included, twenty minutes of it
  # — against a tree the pull request had just finished testing, before
  # the release was allowed to start. The gate is the pull request.
  # Merging is for shipping, and `release.yml` does that without
  # asking the same questions twice.
  #
  # No path filter: these are required checks, and a required check
  # that is skipped never reports, so the pull request waits for it
  # forever.
  pull_request:
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shared logic, on both targets it has to work on. Fast, and the
  # one job that must never be skipped.
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Core and network, JVM and JS
        working-directory: apps
        run: >-
          ./gradlew --no-daemon
          :core:jvmTest :core:jsNodeTest
          :core-net:jvmTest :core-net:jsNodeTest

      # `CoverageGateTest` and `InventoryTest` run inside :core:jvmTest
      # above — re-running them with a filter here would overwrite the
      # results Kover reads.
      - name: Line coverage floor
        working-directory: apps
        run: ./gradlew --no-daemon :core:koverVerify

      # A suite that shrinks is worse than one that fails, because it
      # goes green. `test/suite-floors.json` is the committed number
      # each suite has reached, and it may never go down.
      - name: The suite did not shrink
        run: >-
          node scripts/check-suite-floor.mjs
          core=apps/core/build/test-results/jvmTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-test-results
          path: apps/*/build/test-results/**/*.xml

  # The website, clicked, in a real browser. Karma drives headless
  # Chrome — Compose HTML recomposes on requestAnimationFrame, so a
  # browser that is not painting proves nothing.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Browser tests
        working-directory: apps
        run: ./gradlew --no-daemon :webApp:jsBrowserTest

      - name: It still builds
        working-directory: apps
        run: ./gradlew --no-daemon :webApp:jsBrowserDistribution

      - name: The suite did not shrink
        run: >-
          node scripts/check-suite-floor.mjs
          web=apps/webApp/build/test-results/jsBrowserTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: apps/webApp/build/test-results/**/*.xml

  # The app, on an actual Android. Slow, so it runs last and on its own.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: It compiles
        working-directory: apps
        run: ./gradlew --no-daemon :androidApp:assembleDebug :app:assembleDebug

      # The same 339 screen tests, on the JVM, before an emulator is
      # even started. They are one source run two ways, and this way
      # takes about ninety seconds against the emulator's fourteen
      # minutes — so a broken screen fails the build long before the
      # device job has finished booting. The device run below still
      # happens, for the 26 that need real pixels and for the
      # screenshots.
      - name: Screens, on the JVM
        working-directory: apps
        run: ./gradlew --no-daemon :androidApp:testDebugUnitTest

      # A suite that quietly shrinks is worse than one that fails.
      # Kotlin's incremental compiler has already dropped three whole
      # classes out of a build that then reported success.
      - name: Every test that exists actually ran
        run: >-
          node scripts/check-test-count.mjs
          apps/androidApp/src/sharedTest
          apps/androidApp/build/test-results/testDebugUnitTest

      - name: The screens suite did not shrink
        run: >-
          node scripts/check-suite-floor.mjs
          screens=apps/androidApp/build/test-results/testDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-test-results
          path: apps/androidApp/build/test-results/testDebugUnitTest/*.xml

      # KVM, so the emulator is not software-rendered and the job
      # finishes this century.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: apps
          # :app's LiveApiTest needs a token it is not given here, so
          # it skips itself. Nothing in CI touches the real database.
          script: ./gradlew --no-daemon :androidApp:connectedDebugAndroidTest

      - name: Every test that exists actually ran on the device too
        if: always()
        run: >-
          node scripts/check-test-count.mjs
          apps/androidApp/src/sharedTest
          apps/androidApp/build/outputs/androidTest-results

      - name: The device suite did not shrink
        if: always()
        run: >-
          node scripts/check-suite-floor.mjs
          device=apps/androidApp/build/outputs/androidTest-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: apps/androidApp/build/outputs/androidTest-results/**/*.xml

  # One number, so a pull request says how much was actually run.
  tally:
    runs-on: ubuntu-latest
    needs: [shared, web, android]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results
      # Reports, does not judge — `shared`, `web` and `android` above
      # already fail on a red test, and a second X for the same cause
      # is noise.
      - name: Count them
        continue-on-error: true
        run: python3 scripts/count_tests.py results

  # The app, on a phone. The site's Download button points at
  # `releases/latest/download/mtg-collection.apk`, and until now
  # nothing put an APK there — every release was cut by hand, so the
  # button served whatever somebody last remembered to upload.
  #
  # Only from main, and only behind the tests above: shipping a build
  # that failed its own suite to a phone is worse than not shipping.
