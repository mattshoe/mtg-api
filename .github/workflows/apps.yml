name: apps

# Everything the phone and the website are made of, on every push.
#
# Before this existed the only automated check was the Worker's own
# Vitest suite; the 800-odd Kotlin tests ran when somebody remembered
# to run them, which is the same as not having them. The deploy gate in
# pages.yml runs the fast half of this — a red test there stops the
# site going out — and this runs all of it including the emulator.
on:
  # Pull requests only.
  #
  # This used to run on pushes to main as well, which meant merging
  # re-ran the entire matrix — emulator included, twenty minutes of it
  # — against a tree the pull request had just finished testing, before
  # the release was allowed to start. The gate is the pull request.
  # Merging is for shipping, and `release.yml` does that without
  # asking the same questions twice.
  #
  # No path filter: these are required checks, and a required check
  # that is skipped never reports, so the pull request waits for it
  # forever.
  pull_request:
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shared logic, on both targets it has to work on. Fast, and the
  # one job that must never be skipped.
  shared:
    runs-on: ubuntu-latest
    steps:
      # Full history, so `check-suite-floor.mjs` can compare the
      # committed floors against main's. On a shallow checkout
      # `git show origin/main:test/suite-floors.json` fails, the guard
      # catches it and sets the reference to undefined, and a floor
      # lowered by a merge resolution passes silently — in the only place
      # that conflict ever lands.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Core and network, JVM and JS
        working-directory: apps
        run: >-
          ./gradlew
          :core:jvmTest :core:jsNodeTest
          :core-net:jvmTest :core-net:jsNodeTest

      # `CoverageGateTest` and `InventoryTest` run inside :core:jvmTest
      # above — re-running them with a filter here would overwrite the
      # results Kover reads.
      - name: Line coverage floor
        working-directory: apps
        run: ./gradlew :core:koverVerify

      # A suite that shrinks is worse than one that fails, because it
      # goes green. `test/suite-floors.json` is the committed number
      # each suite has reached, and it may never go down.
      - name: The suite did not shrink
        run: >-
          node scripts/check-suite-floor.mjs
          core=apps/core/build/test-results/jvmTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-test-results
          path: apps/*/build/test-results/**/*.xml

  # The website, clicked, in a real browser. Karma drives headless
  # Chrome — Compose HTML recomposes on requestAnimationFrame, so a
  # browser that is not painting proves nothing.
  web:
    runs-on: ubuntu-latest
    steps:
      # Full history, so `check-suite-floor.mjs` can compare the
      # committed floors against main's. On a shallow checkout
      # `git show origin/main:test/suite-floors.json` fails, the guard
      # catches it and sets the reference to undefined, and a floor
      # lowered by a merge resolution passes silently — in the only place
      # that conflict ever lands.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Browser tests
        working-directory: apps
        run: ./gradlew :webApp:jsBrowserTest

      - name: It still builds
        working-directory: apps
        run: ./gradlew :webApp:jsBrowserDistribution

      - name: The suite did not shrink
        run: >-
          node scripts/check-suite-floor.mjs
          web=apps/webApp/build/test-results/jsBrowserTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: apps/webApp/build/test-results/**/*.xml

  # The app's screens, on the JVM. They are one source run two ways, and
  # this way takes minutes against the emulator's ten — so a broken
  # screen fails here first. It used to run in the same job as the
  # emulator, in front of it, which put the two end to end: eighteen
  # minutes for a pull request. Now they run side by side.
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history, so `check-suite-floor.mjs` can compare the
      # committed floors against main's. On a shallow checkout
      # `git show origin/main:test/suite-floors.json` fails, the guard
      # catches it and sets the reference to undefined, and a floor
      # lowered by a merge resolution passes silently — in the only place
      # that conflict ever lands.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: It compiles
        working-directory: apps
        run: ./gradlew :androidApp:assembleDebug

      - name: Screens, on the JVM
        working-directory: apps
        run: ./gradlew :androidApp:testDebugUnitTest

      # A suite that quietly shrinks is worse than one that fails.
      # Kotlin's incremental compiler has already dropped three whole
      # classes out of a build that then reported success.
      - name: Every test that exists actually ran
        run: >-
          node scripts/check-test-count.mjs
          apps/androidApp/src/sharedTest
          apps/androidApp/build/test-results/testDebugUnitTest

      - name: The screens suite did not shrink
        run: >-
          node scripts/check-suite-floor.mjs
          screens=apps/androidApp/build/test-results/testDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-test-results
          # test-order.log as well: a hung test writes no XML, and a
          # START with no END in this file is the only thing that
          # names it. Without it a timed-out suite uploaded nothing.
          path: |
            apps/androidApp/build/test-results/testDebugUnitTest/*.xml
            apps/androidApp/build/test-order.log

  # The app, on an actual Android, split across three emulators.
  #
  # One emulator spent 6:34 running 469 tests, and before that it
  # downloaded a system image and cold-booted. Now each shard runs a
  # third of them — `numShards` and `shardIndex` are AndroidJUnitRunner's
  # own, so the split is by test and the runner decides it — and the
  # system image and a booted snapshot come out of a cache that
  # `emulator-cache.yml` fills from main.
  #
  # A shard on its own cannot be held to the device floor; `android`
  # below adds them back up.
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One shard failing must not cancel the others: each one is a
      # third of what `android` counts.
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # Built before the emulator starts, so a compile error fails in a
      # minute rather than after a boot.
      - name: The app and its tests, built
        working-directory: apps
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest

      # KVM, so the emulator is not software-rendered and the job
      # finishes this century.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Restore only. A pull request's cache is visible to that pull
      # request alone, so saving here would help nobody else;
      # `emulator-cache.yml` saves from main, where every branch can
      # read it. A miss is a cold boot, which is slower and no less
      # correct.
      - name: Emulator, from the cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: avd-34-google_apis-x86_64-v1

      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: apps
          script: >-
            ./gradlew :androidApp:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.numShards=${{ strategy.job-total }}
            -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ strategy.job-index }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results-shard-${{ matrix.shard }}
          path: apps/androidApp/build/outputs/androidTest-results/**/*.xml

  # Both shards, added back up. Each is checked as part of the whole:
  # a shard that ran nothing would otherwise go green on its own.
  android:
    runs-on: ubuntu-latest
    needs: [device]
    steps:
      # Full history, so `check-suite-floor.mjs` can compare the
      # committed floors against main's. On a shallow checkout
      # `git show origin/main:test/suite-floors.json` fails, the guard
      # catches it and sets the reference to undefined, and a floor
      # lowered by a merge resolution passes silently — in the only place
      # that conflict ever lands.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: android-test-results-shard-*
          path: device-results

      - name: Every test that exists actually ran on the device too
        run: >-
          node scripts/check-test-count.mjs
          apps/androidApp/src/sharedTest
          device-results

      - name: The device suite did not shrink
        run: >-
          node scripts/check-suite-floor.mjs
          device=device-results

  tally:
    runs-on: ubuntu-latest
    needs: [shared, web, screens, android]
    if: always()
    steps:
      # Full history, so `check-suite-floor.mjs` can compare the
      # committed floors against main's. On a shallow checkout
      # `git show origin/main:test/suite-floors.json` fails, the guard
      # catches it and sets the reference to undefined, and a floor
      # lowered by a merge resolution passes silently — in the only place
      # that conflict ever lands.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: results
      # Reports, does not judge — `shared`, `web`, `screens` and `android`
      # already fail on a red test, and a second X for the same cause
      # is noise.
      - name: Count them
        continue-on-error: true
        run: python3 scripts/count_tests.py results

  # The app, on a phone. The site's Download button points at
  # `releases/latest/download/mtg-collection.apk`, and until now
  # nothing put an APK there — every release was cut by hand, so the
  # button served whatever somebody last remembered to upload.
  #
  # Only from main, and only behind the tests above: shipping a build
  # that failed its own suite to a phone is worse than not shipping.
