name: release

# The APK, on merge. No tests.
#
# They already ran. `apps.yml` is a required check on the pull
# request, against the same tree that is being merged, emulator and
# all — running them again here bought nothing and cost twenty minutes
# before the Download button saw a new build.
#
# Which does mean a direct push to main ships untested. That is what
# branch protection is for: require the `apps` checks and main can only
# arrive through a pull request that passed them.
on:
  push:
    branches: [main]
  # Dispatch too, so a release can be re-cut by hand without inventing
  # a commit — the key or the runner having been the thing that went
  # wrong, not the code.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No key, no APK — but not a red build either. Android refuses
      # to update an app signed with a different key, so the only
      # alternatives are "publish nothing" and "publish something
      # nobody can install over the top". It says so loudly on every
      # run instead of failing, so main stays honest about the tests
      # rather than about a missing secret.
      - name: Is the signing key here
        id: key
        env:
          STORE: ${{ secrets.MTG_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$STORE" ]; then
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning::No APK published: MTG_ANDROID_KEYSTORE_BASE64 is not set." \
                 "Android will not update an app signed with a different key, so this" \
                 "job will not substitute one. See the README for the three secrets."
            {
              echo "### Android app not published"
              echo
              echo "The signing key is not available to this build, so no APK was"
              echo "produced. The Download button still serves the last release."
              echo "Add \`MTG_ANDROID_KEYSTORE_BASE64\`, \`MTG_ANDROID_KEYSTORE_PASSWORD\`"
              echo "and \`MTG_ANDROID_KEY_ALIAS\` — see the README."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "have=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.key.outputs.have == 'yes'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.have == 'yes'

      - name: Unpack the signing key
        if: steps.key.outputs.have == 'yes' 
        env:
          STORE: ${{ secrets.MTG_ANDROID_KEYSTORE_BASE64 }}
        run: echo "$STORE" | base64 -d > "$RUNNER_TEMP/mtg-release.jks"

      # Commits on main only ever go up, so the code only ever goes up,
      # which is the one thing Android insists on. The offset keeps it
      # above the 4 that was last published by hand.
      #
      # The name is semver: the newest android-v tag, bumped by the
      # `bump:` the merge's release note declares, a patch if it says
      # nothing. See scripts/next-version.mjs and release-notes/README.md.
      - name: Work out the version
        if: steps.key.outputs.have == 'yes'
        id: v
        run: |
          echo "code=$(( $(git rev-list --count HEAD) + 100 ))" >> "$GITHUB_OUTPUT"
          echo "name=$(node scripts/next-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        if: steps.key.outputs.have == 'yes'
        working-directory: apps
        env:
          MTG_ANDROID_KEYSTORE: ${{ runner.temp }}/mtg-release.jks
          MTG_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MTG_ANDROID_KEYSTORE_PASSWORD }}
          MTG_ANDROID_KEY_ALIAS: ${{ secrets.MTG_ANDROID_KEY_ALIAS }}
          MTG_VERSION_CODE: ${{ steps.v.outputs.code }}
          MTG_VERSION_NAME: ${{ steps.v.outputs.name }}
        run: ./gradlew --no-daemon :androidApp:assembleRelease

      - name: It has to actually be signed
        if: steps.key.outputs.have == 'yes'
        run: |
          APK=$(find apps/androidApp/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::no APK was produced"; exit 1; }
          cp "$APK" mtg-collection.apk
          # An unsigned APK installs on nothing. Fail here rather than
          # publishing one to the Download button.
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs mtg-collection.apk

      # The deep links only work while the site vouches for this exact
      # certificate. If the key is ever rotated and
      # `frontend/.well-known/assetlinks.json` is not, Android stops
      # verifying the link and every mtg.mattshoe.org tap quietly opens
      # a browser instead of the app — with nothing failing anywhere.
      # So the APK that is about to ship is checked against the file
      # the site is about to serve.
      - name: The site still vouches for this signing key
        if: steps.key.outputs.have == 'yes'
        run: |
          APK_SHA=$("$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs             mtg-collection.apk | grep -i 'SHA-256 digest' | head -1             | sed 's/.*: *//' | tr -d ' \n' | tr 'A-F' 'a-f')
          SITE_SHA=$(grep -oE '[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){31}'             frontend/.well-known/assetlinks.json | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          echo "apk:  $APK_SHA"
          echo "site: $SITE_SHA"
          if [ -z "$SITE_SHA" ]; then
            echo "::error::frontend/.well-known/assetlinks.json has no fingerprint in it"
            exit 1
          fi
          if [ "$APK_SHA" != "$SITE_SHA" ]; then
            echo "::error::The APK is signed with a key the site does not vouch for." \
                 "Deep links will stop opening the app. Put $APK_SHA into" \
                 "frontend/.well-known/assetlinks.json (colon-separated, uppercase)."
            exit 1
          fi

      - name: Publish it where the site looks for it
        if: steps.key.outputs.have == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v${{ steps.v.outputs.name }}-${{ steps.v.outputs.code }}"
          # The body is the release note the merge added under
          # release-notes/, which Admin Settings lists as the release
          # notes on both platforms. See scripts/release-note.mjs.
          node scripts/release-note.mjs > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" mtg-collection.apk \
            --title "Android app ${{ steps.v.outputs.name }} (${{ steps.v.outputs.code }})" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
