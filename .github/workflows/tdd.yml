name: tdd

# The discipline, enforced.
#
# CI cannot watch somebody write a test before the code. It can check
# what is left behind when they did: the commit changed tests as well
# as production code, and the message says what was red beforehand.
# `scripts/check-tdd.mjs` does both, and `test/check-tdd.test.js`
# tests the rules — the gate was itself written test-first, which
# seemed like the minimum.
#
# CLAUDE.md is the rule this enforces. Read that first.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      # The whole history. `fetch-depth: 1` would leave nothing to
      # compare against and the gate would pass by knowing nothing,
      # which is the worst way for a check like this to fail.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # The rules themselves, before they are trusted to judge
      # anything.
      - name: The gate's own tests
        run: npx vitest run test/check-tdd.test.js --reporter=basic

      # Only the commits this pull request is proposing, measured
      # from where it actually forked rather than from the tip of the
      # base — otherwise every commit that landed on main in the
      # meantime gets judged again.
      - name: Every commit in this pull request is test-first
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          echo "judging ${base}..HEAD"
          node scripts/check-tdd.mjs "${base}..HEAD"

      # A direct push to main. `github.event.before` is all zeroes for
      # a new branch and for the first push to an empty repo, so fall
      # back to the single commit rather than handing git a range it
      # will reject.
      - name: Every commit in this push is test-first
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            range="${{ github.sha }}~1..${{ github.sha }}"
          else
            range="${before}..${{ github.sha }}"
          fi
          echo "judging ${range}"
          node scripts/check-tdd.mjs "${range}"
