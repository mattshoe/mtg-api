name: pages

# GitHub Pages can only serve the repo root or /docs when publishing from a
# branch, and the frontend lives in /frontend — so publish it as an artifact
# from Actions instead. Set Pages source to "GitHub Actions" once, in
# Settings → Pages.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      # The site is the Kotlin build now, so a change to the shared code
      # or to either UI changes what gets published.
      - 'apps/**'
      - '.github/workflows/pages.yml'
      # The stamper rewrites the frontend on the way out, so a change to it
      # changes what gets published even when nothing under frontend/ moved.
      - 'scripts/stamp_assets.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # The page and the Android app are the same Kotlin. Building it
      # here rather than committing a bundle is what stops the two from
      # drifting: a change to the shared core cannot reach one platform
      # without reaching the other.
      - name: Build the shared web bundle
        working-directory: apps
        run: ./gradlew --no-daemon :webApp:jsBrowserDistribution

      # Everything that does not need a phone. A red test here stops
      # the deploy rather than shipping a screen that lost a feature —
      # including the browser suite, which is the only thing that
      # catches a page that renders but cannot be typed into.
      - name: Test the shared core
        working-directory: apps
        run: >-
          ./gradlew --no-daemon
          :core:jvmTest :core:jsNodeTest
          :core-net:jvmTest :core-net:jsNodeTest

      - name: Test the site in a browser
        working-directory: apps
        run: ./gradlew --no-daemon :webApp:jsBrowserTest

      - name: Coverage floor
        working-directory: apps
        run: ./gradlew --no-daemon :core:koverVerify

      - name: Count what ran
        if: always()
        run: python3 scripts/count_tests.py apps

      - name: Stage the bundle
        run: |
          mkdir -p frontend/kmp
          cp apps/webApp/build/dist/js/productionExecutable/mtg.js frontend/kmp/

      # Pages serves everything with max-age=600 and will not let us say
      # otherwise, so the URLs have to carry the version instead.
      - name: Stamp asset versions
        run: python3 scripts/stamp_assets.py frontend "${GITHUB_SHA::12}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deploy
        uses: actions/deploy-pages@v4
