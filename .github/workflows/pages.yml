name: pages

# GitHub Pages can only serve the repo root or /docs when publishing from a
# branch, and the frontend lives in /frontend — so publish it as an artifact
# from Actions instead. Set Pages source to "GitHub Actions" once, in
# Settings → Pages.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Pages serves everything with max-age=600 and will not let us say
      # otherwise, so the URLs have to carry the version instead.
      - name: Stamp asset versions
        run: python3 scripts/stamp_assets.py frontend "${GITHUB_SHA::12}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deploy
        uses: actions/deploy-pages@v4
