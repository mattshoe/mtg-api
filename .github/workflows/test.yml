name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history, so `check-suite-floor.mjs` can compare the
      # committed floors against main's. On a shallow checkout
      # `git show origin/main:test/suite-floors.json` fails, the guard
      # catches it and sets the reference to undefined, and a floor
      # lowered by a merge resolution passes silently — in the only place
      # that conflict ever lands.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Runs the real Worker against a local D1 in workerd. No Cloudflare
      # credentials needed and nothing touches the live database.
      - run: npm test

      # A suite that shrinks is worse than one that fails, because it
      # goes green. The floor lives in `test/suite-floors.json` and may
      # never go down. Re-run with a JUnit reporter rather than parsing
      # the human output, which is not a format.
      - name: The suite did not shrink
        run: |
          npx vitest run --reporter=junit --outputFile=.vitest-results/results.xml
          node scripts/check-suite-floor.mjs worker=.vitest-results

      # The shell harness has its own config, so the junit run above
      # cannot see it — and without this, deleting all sixty of its tests
      # left CI green, in the repo whose floor mechanism exists precisely
      # to stop that.
      - name: The shell harness did not shrink either
        run: |
          npx vitest run --config vitest.shell.config.js \
            --reporter=junit --outputFile=.vitest-shell-results/results.xml
          node scripts/check-suite-floor.mjs shell=.vitest-shell-results
