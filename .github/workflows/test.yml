name: test

on:
  # A branch with an open pull request used to run this TWICE on every
  # push: once for `push` and once for `pull_request`. Every test run in
  # the repo was billed double, which is how an Actions limit arrives
  # without anybody doing anything unusual.
  #
  # `pull_request` is the one that matters — it is what the merge gate
  # reads. `push` is kept for main alone, so a merge is still checked
  # on the thing that actually shipped.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pushing five times should not leave five full runs going. The newest
# push is the only one anybody cares about; the rest are cancelled.
# `apps.yml` has had this for a while and this should have matched it.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Worker suite, split across three runners.
  #
  # It used to be one job running all forty-odd test files at once. The
  # pool gives every file its own workerd process, and somewhere around
  # 930 tests that stopped fitting on a standard runner: workerd was
  # killed mid-run with "Network connection lost", and every test after
  # it in that process failed with "table cards already exists" because
  # the storage it meant to roll back had gone with it.
  #
  # It had been close to the edge for a while and crossed it on a
  # Tuesday afternoon with nothing merged. The proof it was the machine
  # and not the code: main's own last green commit, re-run unchanged on
  # the same runner image and the same lockfile, failed.
  #
  # Three shards means a third of the files per machine. Vitest splits
  # them by file, so a shard is a whole number of files and no test runs
  # twice. The counts are summed back together in `floor` below, which
  # is what stops a lost shard reading as a smaller suite.
  worker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # Lint once, on the first shard. It is the same answer on all
      # three and costs the same every time.
      - if: matrix.shard == 1
        run: npx eslint frontend/js frontend/sw.js

      # One run, not two. This used to run the whole suite for the
      # output and then again for the JUnit file, which doubled the
      # cost of the thing that was already too expensive.
      - name: Tests
        run: >-
          node scripts/guard.mjs 1500 --
          npx vitest run --shard=${{ matrix.shard }}/3
          --reporter=default --reporter=junit
          --outputFile.junit=test-results/worker/shard-${{ matrix.shard }}.xml

      # `test-results`, not `.vitest-results`. upload-artifact globs with
      # @actions/glob, which skips hidden paths — so a dot-prefixed
      # directory uploads nothing and warns rather than failing. All four
      # uploads here found no files while every test passed, and the only
      # thing that went red was the job that tried to download them.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-results-${{ matrix.shard }}
          path: test-results/worker/*.xml

  # The shell harness runs in node, not workerd, so it is small and
  # stays whole.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Tests
        run: >-
          npx vitest run --config vitest.shell.config.js
          --reporter=default --reporter=junit
          --outputFile.junit=test-results/shell/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-results
          path: test-results/shell/*.xml

  # A suite that shrinks is worse than one that fails, because it goes
  # green. The floor is judged on the shards added back together — a
  # shard that vanished has to read as a smaller suite, which is exactly
  # what this catches.
  floor:
    runs-on: ubuntu-latest
    needs: [worker, shell]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: worker-results-*
          path: test-results/worker
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: shell-results
          path: test-results/shell
      # `countFrom` sums every .xml it finds under the directory, so
      # three shard files add up to the whole suite with no arithmetic
      # here.
      - run: node scripts/check-suite-floor.mjs worker=test-results/worker shell=test-results/shell
